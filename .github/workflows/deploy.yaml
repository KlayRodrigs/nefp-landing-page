name: Deploy to GitHub Pages

# Só dispara manualmente, pela aba "Actions" do repositório
on:
  workflow_dispatch:

# Permissões mínimas necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dois deploys rodem ao mesmo tempo; deixa o mais recente terminar
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_TEMPLATE_ID_NOTIFY: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID_NOTIFY }}
          VITE_EMAILJS_TEMPLATE_ID_AUTOREPLY: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID_AUTOREPLY }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do build (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4